<head>

  <style>
    :root {
      --bg-main: #181818;
      --bg-card: #242424;
      --border-color: #383838;
      --gold: #D4AF37;
      --gold-light: #f3d675;
      --text-main: #ffffff;
      --text-muted: #b5b5b5;
      --accent-live: #2ecc71; /* Verde vivo para o "A decorrer agora" */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 6px;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Seletor de Abas (Dias + "Agora") */
    .tabs-container {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      flex: 1;
      min-width: 58px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 7px 2px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--gold);
      color: #121212;
      border-color: var(--gold);
    }

    .tab-btn.live-tab {
      border-color: var(--accent-live);
    }
    .tab-btn.live-tab.active {
      background: var(--accent-live);
      color: #fff;
    }

    /* Filtro por Local */
    .filter-container {
      margin-bottom: 8px;
    }

    .filter-select {
      width: 100%;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 6px;
      outline: none;
    }

    .filter-select:focus {
      border-color: var(--gold);
    }

    /* Lista de Eventos */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .evento-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--gold);
      padding: 9px;
      border-radius: 6px;
    }

    .evento-item.is-live {
      border-left-color: var(--accent-live);
      background-color: #1f3325;
      border-color: #27ae60;
    }

    .evento-hora {
      font-size: 11px;
      color: var(--gold-light);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .evento-local {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .evento-titulo {
      font-size: 13px;
      color: var(--text-main);
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .status-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .no-events {
      text-align: center;
      padding: 25px;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
