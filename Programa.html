<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa - Festa Templária 2026</title>
  <style>
    :root {
      --bg-main: #181818;
      --bg-card: #242424;
      --border-color: #383838;
      --gold: #D4AF37;
      --gold-light: #f3d675;
      --text-main: #ffffff;
      --text-muted: #b5b5b5;
      --accent-live: #2ecc71;
      --accent-red: #c0392b; /* Vermelho vivo para as abas dos dias */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
      padding: 6px;
      width: 100%;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Seletor de Abas (Dias + "Agora") */
    .tabs-container {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      flex: 1;
      min-width: 55px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 2px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
    }

    /* Aba dos Dias Selecionada: Fundo Vermelho e Letras Brancas */
    .tab-btn.active {
      background: var(--accent-red) !important;
      color: #ffffff !important;
      border-color: var(--accent-red) !important;
    }

    /* Aba "Agora" Selecionada: Mantém o Verde Vivo */
    .live-tab.active {
      background: var(--accent-live) !important;
      color: #ffffff !important;
      border-color: var(--accent-live) !important;
    }

    /* Filtro por Local */
    .filter-container {
      margin-bottom: 8px;
    }

    .filter-select {
      width: 100%;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-family: sans-serif;
    }

    .filter-select:focus {
      border-color: var(--gold);
    }

    /* Lista de Eventos */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .evento-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--gold);
      padding: 9px;
      border-radius: 6px;
    }

    .evento-item.is-live {
      border-left-color: var(--accent-live);
      background-color: #1f3325;
      border-color: #27ae60;
    }

    .evento-hora {
      font-size: 11px;
      color: var(--gold-light);
      font-weight: bold;
      margin-bottom: 2px;
      font-family: sans-serif;
    }

    .evento-local {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: sans-serif;
    }

    .evento-titulo {
      font-size: 13px;
      color: var(--text-main);
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.3;
      font-family: sans-serif;
    }

    .status-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      font-family: sans-serif;
    }

    .no-events {
      text-align: center;
      padding: 25px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

      <button type="button" class="tab-btn live-tab active" onclick="mudarAba('agora', this)">🔴 Agora</button>

    <!-- Filtro por Local -->

    <!-- Lista Dinâmica -->
    <div id="lista-eventos" class="events-list"></div>

  </div>

  <script>

      { dia: 'dia10', inicio: '2026-07-10T23:00:00', fim: '2026-07-10T23:59:00', local: 'Palco Principal', titulo: 'Concerto Albaluna' },

      { dia: 'dia11', inicio: '2026-07-11T10:00:00', fim: '2026-07-11T12:00:00', local: 'Porta de Santiago', titulo: 'Visita Encenada: "1160 - O Dia em que Nasceu o Castelo"' },
      { dia: 'dia11', inicio: '2026-07-11T12:00:00', fim: '2026-07-12T00:00:00', local: 'Vila Templária', titulo: 'Vila Templária: Acampamentos, Falcoaria, Ofícios e Artesanato' },
      { dia: 'dia11', inicio: '2026-07-11T12:00:00', fim: '2026-07-12T00:00:00', local: 'Central Elétrica', titulo: 'Casa da Tortura' },
      { dia: 'dia11', inicio: '2026-07-11T12:00:00', fim: '2026-07-12T03:00:00', local: 'Zona das Tabernas', titulo: 'Tabernas e Restauração' },
      { dia: 'dia11', inicio: '2026-07-11T15:00:00', fim: '2026-07-11T23:00:00', local: 'Vila Templária', titulo: 'Castelo dos Escudeiros e Carrossel Medieval' },

      { dia: 'dia11', inicio: '2026-07-11T17:17:00', fim: '2026-07-11T17:32:00', local: 'Vários Locais', titulo: 'Lugares com História: "Da Utopia à Extinção" (17h17)' },
      { dia: 'dia11', inicio: '2026-07-11T17:47:00', fim: '2026-07-11T18:02:00', local: 'Vários Locais', titulo: 'Lugares com História: "Da Utopia à Extinção" (17h47)' },

      { dia: 'dia12', inicio: '2026-07-12T18:18:00', fim: '2026-07-12T18:33:00', local: 'Igreja da Misericórdia', titulo: 'Lugares com História: "Da Utopia à Extinção - Extinção" (18h18)' },
      { dia: 'dia12', inicio: '2026-07-12T18:00:00', fim: '2026-07-12T20:00:00', local: 'Praça da República', titulo: 'Cortejo de Encerramento (Vila Templária – Praça da República)' }
    ];

    let abaAtual = 'agora';

    function mudarAba(aba, elemento) {
      abaAtual = aba;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (elemento) {
        elemento.classList.add('active');
      }
      renderizarEventos();
    }

    function renderizarEventos() {
      const container = document.getElementById('lista-eventos');
      const selectElement = document.getElementById('filtroLocal');
      const localFiltro = selectElement ? selectElement.value : 'todos';
      const agora = new Date();

      let filtrados = eventos;

      if (abaAtual === 'agora') {
        filtrados = eventos.filter(ev => {
          const inicio = new Date(ev.inicio);
          const fim = new Date(ev.fim);
          return agora >= inicio && agora <= fim;
        });
      } else {
        filtrados = eventos.filter(ev => ev.dia === abaAtual);
      }

      if (localFiltro !== 'todos') {
        filtrados = filtrados.filter(ev => ev.local.toLowerCase() === localFiltro.toLowerCase());
      }

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="no-events">Nenhum evento encontrado para esta seleção.</div>`;
        return;
      }

      let html = '';
      filtrados.forEach(ev => {
        const inicio = new Date(ev.inicio);
        const fim = new Date(ev.fim);
        
        let statusHtml = '';
        let itemClass = 'evento-item';

        const horaInicioStr = inicio.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const horaFimStr = fim.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dataStr = inicio.toLocaleDateString([], { day: '2-digit', month: '2-digit' });

        if (agora >= inicio && agora <= fim) {
          itemClass += ' is-live';
          statusHtml = `<span class="status-badge" style="background-color: #27ae60; color: #fff;">🔴 A decorrer agora</span>`;
        } else if (agora < inicio) {
          statusHtml = `<span class="status-badge" style="background-color: #383838; color: #cccccc;">⏳ Em breve</span>`;
        } else {
          statusHtml = `<span class="status-badge" style="background-color: #2a2a2a; color: #777777;">✔ Terminado</span>`;
        }

        html += `
          <div class="${itemClass}">
            <div class="evento-hora">${horaInicioStr} - ${horaFimStr} (${dataStr})</div>
            <div class="evento-local">📍 ${ev.local}</div>
            <div class="evento-titulo">${ev.titulo}</div>
            ${statusHtml}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    window.onload = function() {
      renderizarEventos();
    };

    setInterval(renderizarEventos, 30000);
  </script>
</body>
</html>
